                "pet travel crate", "airline approved dog crate", "pet stroller", "dog stroller",
                "cat stroller", "dog carrier", "soft sided dog carrier", "hard shell dog carrier",
                "dog sling carrier"
            ],
            "nutrition": [

                "dog anxiety relief", "cbd treats for dogs", "hemp calming treats", "joint supplements for dogs",
                "skin and coat supplements", "digestive supplements"

                "wifi pet camera", "gps dog tracker", "dog activity monitor", "cat gps tracker",

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            // 尝试从localStorage加载
            const saved = localStorage.getItem('tkKeywords');
            if (saved) {
                try {
                    keywordsData = JSON.parse(saved);
                } catch(e) {
                    console.log('Using default keywords');
                }
            }
            displayKeywords(keywordsData);
            updateCount();
        });

        function saveKeywords() {
            localStorage.setItem('tkKeywords', JSON.stringify(keywordsData));
        }

        function displayKeywords(data) {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            
            const categoryNames = {
                cat: '🐱 猫咪用品',
                dog: '🐶 狗狗用品',
                cleaning: '🧼 清洁护理',
                travel_home: '🏠 居家出行',
                nutrition: '🦴 零食营养',
                smart: '🤖 智能设备',
                other: "🐹 其他宠物",
                marketing: "🔥 营销词"
            };

            for (let category in data) {
                const box = document.createElement('div');
                box.className = 'category-box';
                box.innerHTML = `
                    <h3>${categoryNames[category] || category} (${data[category].length})</h3>
                    <div class="keyword-list">
                        ${data[category].map(kw => `<span class="keyword-item">${kw}</span>`).join('')}
                    </div>
                `;
                container.appendChild(box);
            }
        }

        function updateCount() {
            let total = 0;
            for (let cat in keywordsData) {
                total += keywordsData[cat].length;
            }
            document.getElementById('keywords-count').textContent = `Total keywords: ${total}`;
        }

        function addKeyword() {
            const category = document.getElementById('new-keyword-category').value;
            const keyword = document.getElementById('new-keyword').value.trim();
            
            if (!keyword) {
                showToast('Please enter a keyword');
                return;
            }

            if (!keywordsData[category]) {
                keywordsData[category] = [];
            }

            if (keywordsData[category].indexOf(keyword) === -1) {
                keywordsData[category].push(keyword);
                saveKeywords();
                showToast('Keyword added successfully!');
                document.getElementById('new-keyword').value = '';
                displayKeywords(keywordsData);
                updateCount();
            } else {
                showToast('Keyword already exists');
            }
        }

        function generateTitles() {
            const product = document.getElementById('product').value.trim().toLowerCase();
            const description = document.getElementById('description').value.trim().toLowerCase();
            
            if (!product) {
                showToast('Please enter product name');
                return;
            }

            // 收集匹配的关键词
            let matched = [];
            
            // 遍历所有分类找匹配
            for (let category in keywordsData) {
                keywordsData[category].forEach(kw => {
                    const kwLower = kw.toLowerCase();
                    if (kwLower.includes(product) || product.includes(kwLower) || 
                        (description && kwLower.includes(description)) || 
                        (description && description.includes(kwLower)) ||
                        product.split(' ').some(word => kwLower.includes(word))) {
                        if (matched.indexOf(kw) === -1) {
                            matched.push(kw);
                        }
                    }
                });
            }
            
            // 加上营销词
            const marketing = keywordsData.marketing || [];
            
            // 生成5个不同标题
            const titles = generateMultipleTitles(product, matched, marketing);
            
            displayResult(matched, titles);
        }

        function generateMultipleTitles(product, matchedKeywords, marketingWords) {
            // 生成不同风格的标题
            // 1. 基础款 - 核心关键词前置
            // 2. 长尾精准款1
            // 3. 长尾精准款2
            // 4. 营销吸引款1
            // 5. 营销吸引款2
            
            const randomSample = (array, count) => {
                const shuffled = [...array].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, count);
            };

            const titles = [];
            
            // 核心产品词大写开头
            const productClean = product.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
            
            // 1. 基础款
            let core = matchedKeywords.slice(0, 5).filter(kw => kw.toLowerCase() !== product.toLowerCase());
            if (!core.some(kw => kw.toLowerCase() === product.toLowerCase())) {
                core.unshift(productClean);
            } else {
                core = [productClean, ...core];
            }
            const title1 = core.slice(0, 6).join(' - ');
            titles.push({
                type: "基础标准款",
                title: title1,
                length: title1.length
            });
            
            // 2. 长尾精准款1
            if (matchedKeywords.length > 5) {
                let sample1 = randomSample(matchedKeywords, Math.min(8, matchedKeywords.length));
                if (!sample1.some(kw => kw.toLowerCase() === product.toLowerCase())) {
                    sample1.unshift(productClean);
                } else {
                    sample1 = [productClean, ...sample1.filter(kw => kw.toLowerCase() !== product.toLowerCase())];
                }
                const title2 = sample1.slice(0, 7).join(', ');
                titles.push({
                    type: "长尾精准款",
                    title: title2,
                    length: title2.length
                });
            }
            
            // 3. 长尾精准款2
            if (matchedKeywords.length > 8) {
                let sample2 = randomSample(matchedKeywords, Math.min(10, matchedKeywords.length));
                if (!sample2.some(kw => kw.toLowerCase() === product.toLowerCase())) {
                    sample2.unshift(productClean);
                } else {
                    sample2 = [productClean, ...sample2.filter(kw => kw.toLowerCase() !== product.toLowerCase())];
                }
                // 加一个营销词
                if (marketingWords.length > 0) {
                    const mark = randomSample(marketingWords, 1)[0];
                    sample2.push(mark);
                }
                const title3 = sample2.slice(0, 8).join(' | ');
                titles.push({
                    type: "长尾精准款",
                    title: title3,
                    length: title3.length
                });
            }
            
            // 4. 营销吸引款1
            if (marketingWords.length > 0) {
                const marketingSample = randomSample(marketingWords, Math.min(2, marketingWords.length));
                const marketingText = marketingSample.map(m => m.charAt(0).toUpperCase() + m.slice(1)).join(' ');
                let matchedMarketing = matchedKeywords.filter(kw => kw.toLowerCase() !== product.toLowerCase()).slice(0, 5);
                const title4 = `${marketingText} ${productClean}${matchedMarketing.length > 0 ? ' - ' + matchedMarketing.join(' - ') : ''}`;
                titles.push({
                    type: "营销吸引款",
                    title: title4,
                    length: title4.length
                });
            }
            
            // 5. 营销吸引款2
            if (matchedKeywords.length > 5) {
                let allWords = [productClean, ...matchedKeywords.slice(0, 6)];
                if (marketingWords.length > 0) {
                    allWords.push(randomSample(marketingWords, 1)[0]);
                }
                const title5 = allWords.join(' ');
                titles.push({
                    type: "营销吸引款",
                    title: title5,
                    length: title5.length
                });
            }
            
            return titles;
        }

        function displayResult(matched, titles) {
            const section = document.getElementById('result-section');
            section.style.display = 'block';
            
            // 显示匹配的关键词
            const matchedDiv = document.getElementById('matched-keywords');
            matchedDiv.innerHTML = matched.map(kw => `<span class="keyword-tag">${kw}</span>`).join('');
            
            // 显示标题
            const titlesDiv = document.getElementById('result-titles');
            titlesDiv.innerHTML = '';
            
            titles.forEach((item, index) => {
                const titleItem = document.createElement('div');
                titleItem.className = 'title-item';
                titleItem.innerHTML = `
                    <div class="title-type">${item.type} (${item.length} chars)</div>
                    <div class="title-text">
                        ${item.title}
                        <button class="copy-btn" onclick="copyTitle('${encodeURIComponent(item.title)}')">Copy</button>
                    </div>
                `;
                titlesDiv.appendChild(titleItem);
            });

            // 滚动到结果
            section.scrollIntoView({behavior: 'smooth'});
        }

        function copyTitle(title) {
            const decoded = decodeURIComponent(title);
            navigator.clipboard.writeText(decoded).then(() => {
                showToast('Title copied to clipboard!');
            });
        }

        function clearForm() {
            document.getElementById('product').value = '';
            document.getElementById('description').value = '';
            document.getElementById('result-section').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
