<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Shop Pet Title Optimizer - TK美区宠物标题优化工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.05em;
        }
        .content {
            padding: 30px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid #4facfe;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-left: 10px;
        }
        .result-box {
            margin-top: 20px;
        }
        .title-item {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 5px solid #4facfe;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .title-type {
            font-size: 0.85em;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .title-text {
            font-size: 1em;
            word-break: break-all;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 8px 0;
            position: relative;
        }
        .title-length {
            font-size: 0.8em;
            color: #999;
            text-align: right;
        }
        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 0.8em;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: #5568d3;
        }
        .keywords-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .keyword-tag {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .category-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .category-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e1e5e9;
        }
        .category-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1em;
        }
        .keyword-list {
            max-height: 150px;
            overflow-y: auto;
        }
        .keyword-item {
            display: inline-block;
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin: 2px;
        }
        .add-keyword-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .add-keyword-form input {
            flex: 1;
        }
        .count-info {
            text-align: right;
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
            font-size: 1.2em;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s;
            z-index: 1000;
        }
        .toast.show {
            display: block;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
        @media (max-width: 768px) {
            .content {
                padding: 15px;
            }
            .header h1 {
                font-size: 1.5em;
            }
            .add-keyword-form {
                flex-direction: column;
            }
            button {
                width: 100%;
                margin: 5px 0;
            }
            .btn-secondary {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐾 TikTok Shop Pet Title Optimizer</h1>
            <p>TK美区宠物用品标题智能优化工具 - 2026最新热门关键词</p>
        </div>
        <div class="content">
            <!-- 标题生成区域 -->
            <div class="section">
                <h2>✨ 生成优化标题</h2>
                <div class="form-group">
                    <label for="product">商品名称 (Product Name)</label>
                    <input type="text" id="product" placeholder="e.g. Automatic Cat Litter Box">
                </div>
                <div class="form-group">
                    <label for="description">商品描述 (Description - Optional)</label>
                    <textarea id="description" placeholder="Add more details about your product, like features, size, material..."></textarea>
                </div>
                <button onclick="generateTitles()">生成优化标题 Generate Titles</button>
                <button class="btn-secondary" onclick="clearForm()">清空 Clear</button>
            </div>

            <!-- 结果区域 -->
            <div class="section" id="result-section" style="display: none;">
                <h2>🎯 匹配到的关键词</h2>
                <div id="matched-keywords" class="keywords-stats"></div>
                <h2 style="margin-top: 20px;">📝 优化后的标题</h2>
                <div id="result-titles" class="result-box"></div>
            </div>

            <!-- 关键词管理区域 -->
            <div class="section">
                <h2>📚 关键词库管理 (Keywords Library)</h2>
                <div id="keywords-count" class="count-info"></div>
                <div id="categories-container" class="category-container">
                    <!-- 动态加载 -->
                </div>
                <h3 style="margin-top: 20px;">➕ 添加新关键词</h3>
                <div class="add-keyword-form">
                    <select id="new-keyword-category">
                        <option value="cat">猫咪用品 Cat Products</option>
                        <option value="dog">狗狗用品 Dog Products</option>
                        <option value="cleaning">清洁护理 Cleaning</option>
                        <option value="travel_home">居家出行 Travel & Home</option>
                        <option value="nutrition">零食营养 Nutrition</option>
                        <option value="smart">智能设备 Smart Tech</option>
                        <option value="other">其他宠物 Other Pets</option>
                        <option value="marketing">营销词 Marketing</option>
                    </select>
                    <input type="text" id="new-keyword" placeholder="Enter new keyword...">
                    <button onclick="addKeyword()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let keywordsData = {};

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            loadKeywords();
        });

        function loadKeywords() {
            fetch('/api/keywords')
                .then(res => res.json())
                .then(data => {
                    keywordsData = data;
                    displayKeywords(data);
                    updateCount(data);
                });
        }

        function displayKeywords(data) {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            
            const categoryNames = {
                cat: '🐱 猫咪用品',
                dog: '🐶 狗狗用品',
                cleaning: '🧼 清洁护理',
                travel_home: '🏠 居家出行',
                nutrition: '🦴 零食营养',
                smart: '🤖 智能设备',
                other: "🐹 其他宠物",
                marketing: "🔥 营销词"
            };

            for (let category in data) {
                const box = document.createElement('div');
                box.className = 'category-box';
                box.innerHTML = `
                    <h3>${categoryNames[category] || category} (${data[category].length})</h3>
                    <div class="keyword-list">
                        ${data[category].map(kw => `<span class="keyword-item">${kw}</span>`).join('')}
                    </div>
                `;
                container.appendChild(box);
            }
        }

        function updateCount(data) {
            let total = 0;
            for (let cat in data) {
                total += data[cat].length;
            }
            document.getElementById('keywords-count').textContent = `Total keywords: ${total}`;
        }

        function addKeyword() {
            const category = document.getElementById('new-keyword-category').value;
            const keyword = document.getElementById('new-keyword').value.trim();
            
            if (!keyword) {
                showToast('Please enter a keyword');
                return;
            }

            fetch('/api/add_keyword', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({category, keyword})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('Keyword added successfully!');
                    document.getElementById('new-keyword').value = '';
                    loadKeywords();
                } else {
                    showToast(data.message);
                }
            })
            .catch(err => {
                showToast('Error adding keyword');
            });
        }

        function generateTitles() {
            const product = document.getElementById('product').value.trim();
            const description = document.getElementById('description').value.trim();
            
            if (!product) {
                showToast('Please enter product name');
                return;
            }

            fetch('/api/generate_titles', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({product, description})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    displayResult(data);
                } else {
                    showToast('Error generating titles');
                }
            });
        }

        function displayResult(data) {
            const section = document.getElementById('result-section');
            section.style.display = 'block';
            
            // 显示匹配的关键词
            const matchedDiv = document.getElementById('matched-keywords');
            matchedDiv.innerHTML = data.matched_keywords.map(kw => `<span class="keyword-tag">${kw}</span>`).join('');
            
            // 显示标题
            const titlesDiv = document.getElementById('result-titles');
            titlesDiv.innerHTML = '';
            
            data.titles.forEach((item, index) => {
                const titleItem = document.createElement('div');
                titleItem.className = 'title-item';
                titleItem.innerHTML = `
                    <div class="title-type">${item.type} (${item.length} chars)</div>
                    <div class="title-text">
                        ${item.title}
                        <button class="copy-btn" onclick="copyTitle('${encodeURIComponent(item.title)}')">Copy</button>
                    </div>
                `;
                titlesDiv.appendChild(titleItem);
            });

            // 滚动到结果
            section.scrollIntoView({behavior: 'smooth'});
        }

        function copyTitle(title) {
            const decoded = decodeURIComponent(title);
            navigator.clipboard.writeText(decoded).then(() => {
                showToast('Title copied to clipboard!');
            });
        }

        function clearForm() {
            document.getElementById('product').value = '';
            document.getElementById('description').value = '';
            document.getElementById('result-section').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
